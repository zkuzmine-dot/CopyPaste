# Проверки на каждый PR и на push в main и dev: линтер, mypy, pytest и JS-тесты.
# Окружение — как в docker-compose.yml: Python 3.13, PostgreSQL 16, Redis 7
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# Новый push в тот же PR отменяет устаревшую проверку
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Lint and tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: copypaste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d copypaste"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/copypaste
      REDIS_URL: redis://localhost:6379/0
      FILES_DIR: /tmp/copypaste-files
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Секрет одноразовый: подписывает ссылки только внутри этого запуска
      - name: Generate signing secret
        run: echo "FILES_SIGNING_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest -q -p no:cacheprovider

  js:
    name: Tests (JS)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Node tests
        run: node --test "tests/js/*.test.js"
