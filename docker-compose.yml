services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --ws-max-size $${WS_MAX_MESSAGE_BYTES:-1048576} --reload --reload-dir app"
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - .:/app
      # Не внутри папки проекта: она смонтирована сюда, лежит в OneDrive и в git
      - filedata:/data/files
    depends_on:
      db:
        condition: service_healthy

  # Периодические задачи (чистка протухших заметок).
  scheduler:
    build: .
    command: python -m app.scheduler
    env_file: .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - .:/app
      - filedata:/data/files
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  pgdata:
  filedata:
